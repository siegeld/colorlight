# 6 panels, one per connector, 2 wide x 3 tall -> 256x192.
# Position repeated per chain slot: the near panel reads slot 1.
# KEEP UNDER 512 BYTES -- firmware MAX_CONFIG_SIZE truncates silently.
grid: 2x3
panel_width: 128
panel_height: 64
J1: 1,0 1,0
J2: 0,0 0,0
J3: 1,1 1,1
J4: 0,1 0,1
J5: 1,2 1,2
J6: 0,2 0,2
